name: iOS build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The app uses iOS 27's external-display API and the helper targets iOS 26,
    # so the image must carry Xcode 27 (a preview image on GitHub's side).
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      HUSK: ${{ github.workspace }}/Husk
      IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen meson ninja cmake
          rustup target add aarch64-apple-ios

      # Husk supplies what Henge links but does not vendor: StikJIT, the pairing
      # library, libslirp and glib (arm64 iOS). Building it takes a while, so it is
      # cached by the runner image, not by Henge's commits.
      - name: Cache Husk's iOS pieces
        uses: actions/cache@v4
        with:
          path: ${{ env.HUSK }}/build/ios-arm64
          key: husk-ios-arm64-${{ runner.os }}-${{ hashFiles('.github/workflows/ios.yml') }}-v1

      - name: Get Husk's iOS pieces
        run: |
          git clone --depth 1 https://github.com/Leviidev/Husk.git "$HUSK"
          cd "$HUSK"
          if [ ! -f build/ios-arm64/sysroot/lib/libglib-2.0.a ]; then
            ./scripts/fetch_sources.sh
            ./scripts/build_ios.sh libffi glib pixman libucontext libslirp
          fi
          if [ ! -f build/ios-arm64/lib/libhusk_rppairing.a ]; then
            ./scripts/build_rppairing_ios.sh
          fi

      - name: Henge's copy of those pieces
        run: ios/scripts/fetch_deps.sh

      - name: Engine and the Mac helper
        run: make ios-lib build/henge-agent.gz

      - name: The restore stack
        run: ./tools/build_ios_restore.sh

      - name: Xcode project
        run: cd ios && xcodegen generate

      # If the shared scheme is missing, xcodebuild says so in one line. Put that
      # (and the scheme list) in an annotation: the step log needs a sign-in.
      - name: What Xcode sees
        run: |
          xcodebuild -project ios/Henge.xcodeproj -list -json > /tmp/list.json 2>/tmp/list.err || true
          python3 - <<'PY' || cat /tmp/list.err | sed 's/^/::error::/'
          import json
          d = json.load(open('/tmp/list.json'))['project']
          print("::notice::schemes: " + ", ".join(d.get('schemes', [])))
          print("::notice::targets: " + ", ".join(d.get('targets', [])))
          PY

      - name: Build the app
        shell: bash
        run: |
          # GitHub runs this script with -e: catch the failure instead of exiting on it,
          # so the reasons below still get printed.
          set +e
          xcodebuild \
            -project ios/Henge.xcodeproj \
            -scheme Henge \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > xcodebuild.log 2>&1
          rc=$?
          set -e
          tail -40 xcodebuild.log || true
          # The reasons, where they can be read without signing in to GitHub.
          grep -E "error:|Undefined symbols|not found for architecture|Unable to find|BUILD FAILED|does not contain" \
            xcodebuild.log | head -14 | sed 's/^\s*/::error::/' || true
          exit $rc

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
